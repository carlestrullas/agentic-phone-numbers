# Server: Caddy receives all traffic over HTTPS (automatic certificate) and only exposes
#   - POST /webhook/pizzeria/pedido  -> n8n (called by ElevenLabs)
#   - everything else                -> order board (with login)
# The n8n editor is NOT public: access it through an SSH tunnel (see docs/deploy.md).

services:
  n8n:
    ports:
      - "127.0.0.1:5678:5678" # reachable from the server itself only
    environment:
      N8N_HOST: ${DOMAIN}
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${DOMAIN}/
      N8N_PROXY_HOPS: 1
      N8N_SECURE_COOKIE: "false" # the editor is used via http://localhost (SSH tunnel)

  frontend:
    environment:
      REQUIRE_AUTH: "true"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - n8n
      - frontend
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./services/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
