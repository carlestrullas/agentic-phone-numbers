# Local: everything is reachable from this machine only (127.0.0.1).
# Optional public tunnel to test with ElevenLabs: 'tunnel' profile (make tunnel).

services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  n8n:
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    environment:
      N8N_HOST: localhost
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:${N8N_PORT:-5678}/
      N8N_SECURE_COOKIE: "false"

  frontend:
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8081}:8080"

  # --- Cloudflare tunnel: exposes ONLY the order webhook (temporary URL) ---
  tunnel-proxy:
    image: nginx:1.27-alpine
    profiles: ["tunnel"]
    volumes:
      - ./services/tunnel/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - n8n

  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --url http://tunnel-proxy:8080
    depends_on:
      - tunnel-proxy
